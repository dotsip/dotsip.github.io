<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient (Elegan, Bersih & Terang) -->
    <linearGradient id="light-bg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f8f9fb" />
      <stop offset="100%" stop-color="#e6e9ef" />
    </linearGradient>

    <!-- Electric Cyan to Royal Blue Gradient (Surga) -->
    <linearGradient id="l-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e1ff" />
      <stop offset="50%" stop-color="#006aff" />
      <stop offset="100%" stop-color="#1b2ce2" />
    </linearGradient>

    <!-- Deep Electric Violet to Vivid Magenta Gradient (Super Intelligence) -->
    <linearGradient id="l-purple" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ea1fbe" />
      <stop offset="50%" stop-color="#8e1ee8" />
      <stop offset="100%" stop-color="#5522e8" />
    </linearGradient>

    <!-- Drop Shadow untuk Kedalaman 3D Halus di Background Terang -->
    <filter id="l-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#0c1236" flood-opacity="0.22" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" fill="url(#light-bg)" rx="32" />

  <!-- Ambient Compass Ring Subtle -->
  <g stroke="#cbd5e1" stroke-width="0.8" opacity="0.6" fill="none">
    <circle cx="300" cy="215" r="165" stroke-dasharray="3 5" />
    <circle cx="300" cy="215" r="148" />
    <line x1="120" y1="215" x2="480" y2="215" stroke-dasharray="2 6" />
    <line x1="300" y1="35" x2="300" y2="395" stroke-dasharray="2 6" />
  </g>

  <!-- EMBLEM GROUP: AERODYNAMIC SLIT QUANTUM S -->
  <g transform="translate(300, 215) rotate(-22)" filter="url(#l-shadow)">
    <!-- Ring Luar Kaca Minimalis -->
    <circle cx="0" cy="0" r="148" fill="none" stroke="#ffffff" stroke-width="3" opacity="0.9" />
    <circle cx="0" cy="0" r="145" fill="none" stroke="#94a3b8" stroke-width="1" opacity="0.3" />

    <!-- 1. SAYAP BLUE (Surga - Algoritma AI) -->
    <path d="M 0 -144 
             A 144 144 0 0 1 126 70 
             C 92 40, 50 16, 0 16 
             C -38 16, -68 -15, -68 -55 
             C -68 -105, -35 -144, 0 -144 Z" 
          fill="url(#l-blue)" />

    <!-- 2. SAYAP PURPLE (Super Intelligence - Quantum Transformation) -->
    <path d="M 0 144 
             A 144 144 0 0 1 -126 -70 
             C -92 -40, -50 -16, 0 -16 
             C 38 -16, 68 15, 68 55 
             C 68 105, 35 144, 0 144 Z" 
          fill="url(#l-purple)" />
  </g>

  <!-- TYPOGRAPHY SECTION (Formal, Bersih & Kontras Tinggi) -->
  <g text-anchor="middle">
    <!-- Monogram Pill: SSI -->
    <rect x="264" y="396" width="72" height="22" rx="11" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2" />
    <text x="300" y="411" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="800" fill="#006aff" letter-spacing="3.5">SSI</text>

    <!-- Brand Name: SURGA -->
    <text x="300" y="468" 
          font-family="'Montserrat', 'Inter', system-ui, sans-serif" 
          font-size="52" 
          font-weight="800" 
          fill="#141a33" 
          letter-spacing="9">
      SURGA
    </text>

    <!-- Subtitle: SUPER INTELLIGENCE -->
    <text x="300" y="504" 
          font-family="'Inter', system-ui, sans-serif" 
          font-size="16" 
          font-weight="700" 
          fill="#5522e8" 
          letter-spacing="6">
      SUPER INTELLIGENCE
    </text>

    <!-- Tagline: PERPETUAL COMPOUNDING -->
    <text x="300" y="534" 
          font-family="'Inter', system-ui, sans-serif" 
          font-size="11" 
          font-weight="700" 
          fill="#006aff" 
          letter-spacing="4">
      PERPETUAL COMPOUNDING
    </text>
  </g>
</svg>
