<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Vignette (Deep Cosmic & Rich Cinematic) -->
    <radialGradient id="bg-vignette" cx="50%" cy="40%" r="70%">
      <stop offset="0%" stop-color="#0a192f" />
      <stop offset="40%" stop-color="#070d1a" />
      <stop offset="75%" stop-color="#030509" />
      <stop offset="100%" stop-color="#010204" />
    </radialGradient>

    <!-- Ambient Cyan Radial Glow Behind Sphere -->
    <radialGradient id="sphere-ambient-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0284c7" stop-opacity="0.5" />
      <stop offset="35%" stop-color="#0369a1" stop-opacity="0.25" />
      <stop offset="70%" stop-color="#0c4a6e" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <!-- Intense Central Star Flare Gradient -->
    <radialGradient id="core-flare-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="15%" stop-color="#e0f2fe" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.6" />
      <stop offset="70%" stop-color="#0284c7" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Golden Heavenly Gradient (Elemen Surga) -->
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#fef08a" />
      <stop offset="70%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>

    <!-- Translucent Crystalline Facet Gradients -->
    <linearGradient id="facet-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.45" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="facet-soft-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#0369a1" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.05" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="bloom-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="bloom-intense" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="12" result="blur1" />
      <feGaussianBlur stdDeviation="4" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="8" flood-color="#38bdf8" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#0284c7" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- 1. Background -->
  <rect width="1200" height="675" fill="url(#bg-vignette)" />

  <!-- 2. Ambient Deep Light Glow Behind Central Orb -->
  <circle cx="600" cy="260" r="320" fill="url(#sphere-ambient-glow)" />

  <!-- 3. Advanced Circuit Board (PCB) Traces (Sirkuit Lebih Organik & Elegan) -->
  <g stroke="#38bdf8" stroke-width="1.3" opacity="0.3" fill="none">
    <!-- Rangkaian Kiri -->
    <path d="M 310 165 L 485 165 L 500 180 M 340 165 L 360 145 M 390 165 L 410 145" />
    <path d="M 360 190 L 430 190 L 450 205 L 485 205 L 515 205" />
    <path d="M 290 215 L 415 215 L 435 230 L 475 230 L 510 265" />
    <path d="M 345 240 L 470 240 L 485 255" />
    <path d="M 300 260 L 468 260 L 485 277" />
    <path d="M 350 280 L 470 280 L 490 300" />
    <path d="M 295 305 L 420 305 L 440 290 L 475 290 L 510 290" />
    <path d="M 365 330 L 435 330 L 455 315 L 485 315" />
    <path d="M 310 355 L 485 355 L 500 340 M 350 355 L 370 375" />
    
    <!-- Rangkaian Kanan -->
    <path d="M 890 165 L 715 165 L 700 180 M 860 165 L 840 145 M 810 165 L 790 145" />
    <path d="M 840 190 L 770 190 L 750 205 L 715 205 L 685 205" />
    <path d="M 910 215 L 785 215 L 765 230 L 725 230 L 690 265" />
    <path d="M 855 240 L 730 240 L 715 255" />
    <path d="M 900 260 L 732 260 L 715 277" />
    <path d="M 850 280 L 730 280 L 710 300" />
    <path d="M 905 305 L 780 305 L 760 290 L 725 290 L 690 290" />
    <path d="M 835 330 L 765 330 L 745 315 L 715 315" />
    <path d="M 890 355 L 715 355 L 700 340 M 850 355 L 830 375" />
  </g>

  <!-- PCB Solder Dots & Sparkle Nodes (Emas & Cyan Bergantian) -->
  <g fill="#7dd3fc" opacity="0.6">
    <circle cx="310" cy="165" r="2.5" fill="url(#gold-grad)" />
    <circle cx="360" cy="190" r="2" />
    <circle cx="290" cy="215" r="2.5" />
    <circle cx="345" cy="240" r="2" />
    <circle cx="300" cy="260" r="2.5" fill="url(#gold-grad)" />
    <circle cx="350" cy="280" r="2" />
    <circle cx="295" cy="305" r="2" />
    <circle cx="365" cy="330" r="2" />
    <circle cx="310" cy="355" r="2.5" fill="url(#gold-grad)" />
    <circle cx="485" cy="165" r="2" />
    <circle cx="485" cy="205" r="2" />
    <circle cx="475" cy="230" r="2" fill="url(#gold-grad)" />
    <circle cx="470" cy="240" r="2" />
    <circle cx="468" cy="260" r="2" />
    <circle cx="470" cy="280" r="2" />
    <circle cx="475" cy="290" r="2" />
    <circle cx="485" cy="315" r="2" fill="url(#gold-grad)" />
    <circle cx="485" cy="355" r="2" />

    <circle cx="890" cy="165" r="2.5" fill="url(#gold-grad)" />
    <circle cx="840" cy="190" r="2" />
    <circle cx="910" cy="215" r="2.5" />
    <circle cx="855" cy="240" r="2" />
    <circle cx="900" cy="260" r="2.5" fill="url(#gold-grad)" />
    <circle cx="850" cy="280" r="2" />
    <circle cx="905" cy="305" r="2" />
    <circle cx="835" cy="330" r="2" />
    <circle cx="890" cy="355" r="2.5" fill="url(#gold-grad)" />
    <circle cx="715" cy="165" r="2" />
    <circle cx="715" cy="205" r="2" />
    <circle cx="725" cy="230" r="2" fill="url(#gold-grad)" />
    <circle cx="730" cy="240" r="2" />
    <circle cx="732" cy="260" r="2" />
    <circle cx="730" cy="280" r="2" />
    <circle cx="725" cy="290" r="2" />
    <circle cx="715" cy="315" r="2" fill="url(#gold-grad)" />
    <circle cx="715" cy="355" r="2" />
  </g>

  <!-- Fine Data Particles (Floating Digital Dust) -->
  <g fill="#38bdf8" opacity="0.35">
    <circle cx="340" cy="120" r="1.2" />
    <circle cx="370" cy="210" r="1" />
    <circle cx="280" cy="270" r="1.5" />
    <circle cx="330" cy="390" r="0.8" />
    <circle cx="410" cy="370" r="1.2" fill="#c084fc" />
    <circle cx="860" cy="120" r="1.2" />
    <circle cx="830" cy="210" r="1" />
    <circle cx="920" cy="270" r="1.5" />
    <circle cx="870" cy="390" r="0.8" />
    <circle cx="790" cy="370" r="1.2" fill="#c084fc" />
  </g>

  <!-- 4. Luminous Crystal Sphere Assembly -->
  <!-- Double Spherical Outer Halo (With Cosmic Glow Effect) -->
  <circle cx="600" cy="260" r="135" fill="none" stroke="url(#gold-grad)" stroke-width="1" opacity="0.3" filter="url(#bloom-soft)" />
  <circle cx="600" cy="260" r="132" fill="none" stroke="#38bdf8" stroke-width="1.8" opacity="0.55" filter="url(#bloom-soft)" />
  <circle cx="600" cy="260" r="128" fill="none" stroke="#ffffff" stroke-width="2.5" opacity="0.9" filter="url(#bloom-soft)" />

  <!-- 3D Spherical Latitude & Longitude Arcs (Digital Globe Core) -->
  <g fill="none" stroke="#7dd3fc" stroke-width="1.2" opacity="0.6">
    <ellipse cx="600" cy="260" rx="65" ry="128" />
    <ellipse cx="600" cy="260" rx="32" ry="128" stroke-dasharray="3 3" opacity="0.3" />
    <ellipse cx="600" cy="260" rx="128" ry="65" />
    <ellipse cx="600" cy="260" rx="128" ry="32" stroke-dasharray="3 3" opacity="0.3" />
    <ellipse cx="600" cy="260" rx="128" ry="72" transform="rotate(45 600 260)" opacity="0.4" />
    <ellipse cx="600" cy="260" rx="128" ry="72" transform="rotate(-45 600 260)" opacity="0.4" />
  </g>

  <!-- 5. Sacred Geometry - 8-Fold Crystalline Mandala Facets (Bunga Teratai Surga) -->
  <g fill="url(#facet-cyan-grad)" stroke="#bae6fd" stroke-width="1.3" opacity="0.8" filter="url(#bloom-soft)">
    <path d="M 600.0 130.0 L 576.3 202.7 L 623.7 202.7 Z" />
    <path d="M 691.9 168.1 L 623.7 202.7 L 657.3 236.3 Z" />
    <path d="M 730.0 260.0 L 657.3 236.3 L 657.3 283.7 Z" stroke="url(#gold-grad)" />
    <path d="M 691.9 351.9 L 657.3 283.7 L 623.7 317.3 Z" />
    <path d="M 600.0 390.0 L 623.7 317.3 L 576.3 317.3 Z" />
    <path d="M 508.1 351.9 L 576.3 317.3 L 542.7 283.7 Z" />
    <path d="M 470.0 260.0 L 542.7 283.7 L 542.7 236.3 Z" stroke="url(#gold-grad)" />
    <path d="M 508.1 168.1 L 542.7 236.3 L 576.3 202.7 Z" />
  </g>

  <!-- Diamond Inner Facets (Radiating) -->
  <g fill="url(#facet-soft-grad)" stroke="#ffffff" stroke-width="1.5" opacity="0.9">
    <path d="M 600.0 174.0 L 623.7 202.7 L 600 260 L 576.3 202.7 Z" />
    <path d="M 660.8 199.2 L 657.3 236.3 L 600 260 L 623.7 202.7 Z" />
    <path d="M 686.0 260.0 L 657.3 283.7 L 600 260 L 657.3 236.3 Z" />
    <path d="M 660.8 320.8 L 623.7 317.3 L 600 260 L 657.3 283.7 Z" />
    <path d="M 600.0 346.0 L 576.3 317.3 L 600 260 L 623.7 317.3 Z" />
    <path d="M 539.2 320.8 L 542.7 283.7 L 600 260 L 576.3 317.3 Z" />
    <path d="M 514.0 260.0 L 542.7 236.3 L 600 260 L 542.7 283.7 Z" />
    <path d="M 539.2 199.2 L 576.3 202.7 L 600 260 L 542.7 236.3 Z" />
  </g>

  <!-- Intersecting Sacred Octagram & Hex Geometry -->
  <g fill="none" stroke="#e0f2fe" stroke-width="1.3" opacity="0.75">
    <polygon points="600.0,130.0 730.0,260.0 600.0,390.0 470.0,260.0" stroke="url(#gold-grad)" stroke-width="1.6" />
    <polygon points="691.9,168.1 691.9,351.9 508.1,351.9 508.1,168.1" stroke-width="1.6" />
    <polygon points="600.0,174.0 660.8,199.2 686.0,260.0 660.8,320.8 600.0,346.0 539.2,320.8 514.0,260.0 539.2,199.2" stroke="#67e8f9" stroke-width="1.2" opacity="0.8" />
    <polygon points="623.7,202.7 657.3,236.3 657.3,283.7 623.7,317.3 576.3,317.3 542.7,283.7 542.7,236.3 576.3,202.7" stroke="#ffffff" stroke-width="1.4" opacity="0.85" />
  </g>

  <!-- Outer Star & Golden Geometry Nodes -->
  <g fill="#ffffff" filter="url(#bloom-soft)">
    <circle cx="600.0" cy="130.0" r="3.2" fill="url(#gold-grad)" />
    <circle cx="691.9" cy="168.1" r="2.8" />
    <circle cx="730.0" cy="260.0" r="3.2" fill="url(#gold-grad)" />
    <circle cx="691.9" cy="351.9" r="2.8" />
    <circle cx="600.0" cy="390.0" r="3.2" fill="url(#gold-grad)" />
    <circle cx="508.1" cy="351.9" r="2.8" />
    <circle cx="470.0" cy="260.0" r="3.2" fill="url(#gold-grad)" />
    <circle cx="508.1" cy="168.1" r="2.8" />
  </g>

  <!-- 6. Radiant 8-Pointed Central Star (Pulsar Light Core) -->
  <circle cx="600" cy="260" r="95" fill="url(#core-flare-grad)" filter="url(#bloom-intense)" />

  <!-- Horizontal & Vertical Lens Flare Streaks -->
  <ellipse cx="600" cy="260" rx="175" ry="2.2" fill="#ffffff" opacity="0.9" filter="url(#bloom-soft)" />
  <ellipse cx="600" cy="260" rx="2.2" ry="175" fill="#ffffff" opacity="0.9" filter="url(#bloom-soft)" />
  <ellipse cx="600" cy="260" rx="110" ry="1.8" transform="rotate(45 600 260)" fill="#7dd3fc" opacity="0.8" />
  <ellipse cx="600" cy="260" rx="1.8" ry="110" transform="rotate(45 600 260)" fill="#7dd3fc" opacity="0.8" />

  <!-- Central Star of Divine Intelligence (8-Pointed Dimension) -->
  <g filter="url(#bloom-intense)">
    <polygon points="600,182 607,248 676,260 607,272 600,338 593,272 524,260 593,248" fill="#ffffff" />
    <polygon points="600,205 605,252 654,260 605,268 600,315 595,268 546,260 595,252" fill="url(#gold-grad)" transform="rotate(45 600 260)" />
  </g>

  <!-- Blinding Cosmic Core -->
  <circle cx="600" cy="260" r="13" fill="#ffffff" filter="url(#bloom-soft)" />
  <circle cx="600" cy="260" r="5" fill="#ffffff" />

  <!-- 7. Premium Perimeter Flare & Space Sparkles -->
  <!-- Top-Left Cyan Lens Flare -->
  <g transform="translate(505, 170)" filter="url(#bloom-soft)">
    <circle cx="0" cy="0" r="16" fill="#38bdf8" opacity="0.45" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
    <path d="M 0 -18 L 0 18 M -18 0 L 18 0" stroke="#ffffff" stroke-width="1.2" opacity="0.75" />
  </g>

  <!-- Top-Right Divine Golden Star -->
  <g transform="translate(705, 175)" filter="url(#bloom-intense)">
    <circle cx="0" cy="0" r="14" fill="#fbbf24" opacity="0.5" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
    <path d="M 0 -14 L 0 14 M -14 0 L 14 0" stroke="url(#gold-grad)" stroke-width="1" />
  </g>

  <!-- Bottom-Left Deep Amethyst Sparkle -->
  <g transform="translate(492, 348)" filter="url(#bloom-soft)">
    <circle cx="0" cy="0" r="18" fill="#c084fc" opacity="0.4" />
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
    <path d="M 0 -12 L 0 12 M -12 0 L 12 0" stroke="#f3e8ff" stroke-width="0.8" opacity="0.6" />
  </g>

  <!-- Bottom-Right Cyan Sparkle -->
  <g transform="translate(692, 348)" filter="url(#bloom-soft)">
    <circle cx="0" cy="0" r="14" fill="#38bdf8" opacity="0.4" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>

  <!-- 8. Premium Typography Section -->
  <g text-anchor="middle">
    <!-- Brand Name: SURGA -->
    <text x="600" y="495" 
          font-family="'Montserrat', 'Rajdhani', 'Segoe UI', system-ui, sans-serif" 
          font-size="68" 
          font-weight="900" 
          fill="url(#gold-grad)" 
          letter-spacing="15"
          filter="url(#text-glow)">
      SURGA
    </text>

    <!-- Subtitle: SUPER INTELLIGENCE (Soft-Chamber Gradient Light) -->
    <text x="600" y="542" 
          font-family="'Montserrat', 'Segoe UI', system-ui, sans-serif" 
          font-size="20" 
          font-weight="800" 
          fill="#38bdf8" 
          letter-spacing="9"
          opacity="0.95"
          filter="url(#bloom-soft)">
      SUPER INTELLIGENCE
    </text>
  </g>
</svg>
