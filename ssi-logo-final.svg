<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Clean Background -->
    <radialGradient id="clean-bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#0d1424" />
      <stop offset="55%" stop-color="#080c16" />
      <stop offset="100%" stop-color="#04060a" />
    </radialGradient>

    <!-- Ultra-Vivid 24K Gold Gradient (XAUUSD) - Bersih & Berkilau Tegas -->
    <linearGradient id="vivid-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff8d6" />
      <stop offset="25%" stop-color="#ffd000" />
      <stop offset="65%" stop-color="#d49000" />
      <stop offset="100%" stop-color="#8a5500" />
    </linearGradient>

    <!-- Ultra-Vivid Satoshi Cyan & Sapphire (Bitcoin / AI) - Murni & Bebas Bias Kuning -->
    <linearGradient id="vivid-btc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="35%" stop-color="#00b4d8" />
      <stop offset="75%" stop-color="#0077b6" />
      <stop offset="100%" stop-color="#023e8a" />
    </linearGradient>

    <!-- Pure Black Drop Shadow (Tanpa warna kuning, sehingga warna 100% murni) -->
    <filter id="clean-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75" />
    </filter>

    <!-- Clean Text Shadow (Hitam Netral) -->
    <filter id="text-clean-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="5" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" fill="url(#clean-bg)" rx="32" />

  <!-- Ambient Geometric Compass Grid (Sangat Halus & Netral) -->
  <g stroke="#1e293b" stroke-width="0.8" opacity="0.4" fill="none">
    <circle cx="300" cy="215" r="165" stroke-dasharray="3 4" />
    <circle cx="300" cy="215" r="148" />
    <line x1="120" y1="215" x2="480" y2="215" stroke-dasharray="2 6" />
    <line x1="300" y1="35" x2="300" y2="395" stroke-dasharray="2 6" />
  </g>

  <!-- EMBLEM GROUP: AERODYNAMIC SLIT QUANTUM S -->
  <g transform="translate(300, 215) rotate(-22)" filter="url(#clean-shadow)">
    <!-- Ring Presisi Luar (Netral & Tajam) -->
    <circle cx="0" cy="0" r="148" fill="none" stroke="#334155" stroke-width="1.8" opacity="0.6" />
    <circle cx="0" cy="0" r="145" fill="none" stroke="#94a3b8" stroke-width="1" opacity="0.3" />

    <!-- 1. SAYAP EMAS 24K (XAUUSD / Emas Murni) -->
    <path d="M 0 -144 
             A 144 144 0 0 1 126 70 
             C 92 40, 50 16, 0 16 
             C -38 16, -68 -15, -68 -55 
             C -68 -105, -35 -144, 0 -144 Z" 
          fill="url(#vivid-gold)" />

    <!-- 2. SAYAP SATOSHI CYAN & SAPPHIRE (BITCOIN / AI) -->
    <path d="M 0 144 
             A 144 144 0 0 1 -126 -70 
             C -92 -40, -50 -16, 0 -16 
             C 38 -16, 68 15, 68 55 
             C 68 105, 35 144, 0 144 Z" 
          fill="url(#vivid-btc)" />
  </g>

  <!-- TYPOGRAPHY SECTION -->
  <g text-anchor="middle">
    <!-- Monogram Pill: SSI -->
    <rect x="264" y="396" width="72" height="22" rx="11" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="300" y="411" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffd000" letter-spacing="3.5">SSI</text>

    <!-- Brand Name: SURGA (Putih Bersih & Tajam) -->
    <text x="300" y="468" 
          font-family="'Montserrat', 'Inter', system-ui, sans-serif" 
          font-size="52" 
          font-weight="800" 
          fill="#ffffff" 
          letter-spacing="9"
          filter="url(#text-clean-shadow)">
      SURGA
    </text>

    <!-- Subtitle: SUPER INTELLIGENCE (Cyan Bersih) -->
    <text x="300" y="504" 
          font-family="'Inter', system-ui, sans-serif" 
          font-size="16" 
          font-weight="700" 
          fill="#00b4d8" 
          letter-spacing="6">
      SUPER INTELLIGENCE
    </text>

    <!-- Tagline: PERPETUAL COMPOUNDING (Emerald Cerah) -->
    <text x="300" y="534" 
          font-family="'Inter', system-ui, sans-serif" 
          font-size="11" 
          font-weight="700" 
          fill="#10b981" 
          letter-spacing="4">
      PERPETUAL COMPOUNDING
    </text>
  </g>
</svg>
