<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="100%" height="100%">
  <defs>
    <!-- Deep Cosmic Void Background -->
    <radialGradient id="void" cx="50%" cy="50%" r="75%">
      <stop offset="0%" stop-color="#0a1128" />
      <stop offset="100%" stop-color="#010308" />
    </radialGradient>

    <!-- Ethereal Cyan Gradient for Super Intelligence -->
    <linearGradient id="quantum-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>

    <!-- Celestial Gold Gradient for Surga -->
    <linearGradient id="celestial-gold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#bf953f" />
      <stop offset="50%" stop-color="#fcf6ba" />
      <stop offset="100%" stop-color="#b38728" />
    </linearGradient>

    <!-- Hyper-Realistic Glow Effects -->
    <filter id="bloom" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="8" result="blur1" />
      <feGaussianBlur stdDeviation="20" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Canvas Background -->
  <rect width="800" height="600" fill="url(#void)" />

  <!-- EMBLEM GROUP (Pusat: 400, 240) -->
  <g transform="translate(400, 240)">
    
    <!-- Outer Celestial Orbit (Surga Halo) -->
    <circle cx="0" cy="0" r="145" fill="none" stroke="url(#celestial-gold)" stroke-width="0.75" stroke-dasharray="2 12" opacity="0.8" filter="url(#soft-glow)"/>
    <circle cx="0" cy="0" r="135" fill="none" stroke="url(#celestial-gold)" stroke-width="0.5" opacity="0.3" />

    <!-- Orbital Data Nodes (Bintang Pengorbit) -->
    <circle cx="0" cy="-145" r="2.5" fill="#fcf6ba" filter="url(#bloom)"/>
    <circle cx="125.5" cy="72.5" r="1.5" fill="#00f2fe" filter="url(#soft-glow)" />
    <circle cx="-125.5" cy="72.5" r="1.5" fill="#00f2fe" filter="url(#soft-glow)" />

    <!-- Core Quantum Torus / Digital Lotus (Kecerdasan Buatan) -->
    <g fill="none" stroke="url(#quantum-cyan)" stroke-width="1" opacity="0.65" filter="url(#bloom)">
      <!-- 6 Elips Saling Bersilangan Presisi Matematis -->
      <ellipse cx="0" cy="0" rx="100" ry="22" transform="rotate(0)" />
      <ellipse cx="0" cy="0" rx="100" ry="22" transform="rotate(30)" />
      <ellipse cx="0" cy="0" rx="100" ry="22" transform="rotate(60)" />
      <ellipse cx="0" cy="0" rx="100" ry="22" transform="rotate(90)" />
      <ellipse cx="0" cy="0" rx="100" ry="22" transform="rotate(120)" />
      <ellipse cx="0" cy="0" rx="100" ry="22" transform="rotate(150)" />
    </g>

    <!-- Lapisan Ketajaman Elips (Tanpa Blur) -->
    <g fill="none" stroke="url(#quantum-cyan)" stroke-width="0.5" opacity="0.9">
      <ellipse cx="0" cy="0" rx="100" ry="22" transform="rotate(0)" />
      <ellipse cx="0" cy="0" rx="100" ry="22" transform="rotate(30)" />
      <ellipse cx="0" cy="0" rx="100" ry="22" transform="rotate(60)" />
      <ellipse cx="0" cy="0" rx="100" ry="22" transform="rotate(90)" />
      <ellipse cx="0" cy="0" rx="100" ry="22" transform="rotate(120)" />
      <ellipse cx="0" cy="0" rx="100" ry="22" transform="rotate(150)" />
    </g>

    <!-- The Singularity Spark (Mata Inti Pencerahan) -->
    <circle cx="0" cy="0" r="5" fill="#ffffff" filter="url(#bloom)" />
    <path d="M 0 -30 L 1.5 -5 L 30 0 L 1.5 5 L 0 30 L -1.5 5 L -30 0 L -1.5 -5 Z" fill="url(#celestial-gold)" opacity="0.8" filter="url(#soft-glow)"/>
    <path d="M 0 -15 L 1 -3 L 15 0 L 1 3 L 0 15 L -1 3 L -15 0 L -1 -3 Z" fill="#ffffff" />
  </g>

  <!-- TYPOGRAPHY SECTION -->
  <g text-anchor="middle">
    <!-- Main Brand Name: SURGA -->
    <text x="400" y="470" 
          font-family="'Montserrat', 'Cinzel', 'Helvetica Neue', sans-serif" 
          font-size="62" 
          font-weight="200" 
          fill="#ffffff" 
          letter-spacing="18">
      SURGA
    </text>

    <!-- Subtitle: SUPER INTELLIGENCE -->
    <text x="400" y="515" 
          font-family="'Montserrat', 'Space Grotesk', 'Helvetica Neue', sans-serif" 
          font-size="14" 
          font-weight="600" 
          fill="url(#quantum-cyan)" 
          letter-spacing="14"
          opacity="0.85">
      SUPER INTELLIGENCE
    </text>
  </g>
</svg>
