<svg id="ssi-master-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Background with Radial Vignette -->
    <radialGradient id="ssi-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#04060a" />
    </radialGradient>

    <!-- Imperial Liquid Gold (XAUUSD / Emas Murni) -->
    <linearGradient id="gold-flow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff1b8" />
      <stop offset="25%" stop-color="#ffd700" />
      <stop offset="65%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#8a6306" />
    </linearGradient>

    <!-- Satoshi Cyan & Sapphire (Bitcoin / Super Intelligence) -->
    <linearGradient id="cyan-btc-flow" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="35%" stop-color="#00bbf9" />
      <stop offset="75%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Central S-Spine Glow -->
    <linearGradient id="spine-glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffd700" />
      <stop offset="50%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#00f5d4" />
    </linearGradient>

    <!-- Luxury Ambient Shadows & Bloom -->
    <filter id="gold-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#ffd700" flood-opacity="0.28" />
      <feDropShadow dx="0" dy="24" stdDeviation="32" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="core-bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.9" />
    </filter>

    <filter id="text-gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ffd700" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" fill="url(#ssi-bg)" rx="32" />

  <!-- AMBIENT GEOMETRIC GRID (Subtle Fibonacci Compass) -->
  <g stroke="#334155" stroke-width="0.8" opacity="0.25" fill="none">
    <circle cx="300" cy="215" r="165" stroke-dasharray="3 4" />
    <circle cx="300" cy="215" r="148" />
    <line x1="120" y1="215" x2="480" y2="215" stroke-dasharray="2 6" />
    <line x1="300" y1="35" x2="300" y2="395" stroke-dasharray="2 6" />
  </g>

  <!-- ==============================================
       THE S-YIN-YANG VORTEX EMBLEM (Center: 300, 215)
       ============================================== -->
  <g transform="translate(300, 215) rotate(-22)" filter="url(#gold-shadow)">
    
    <!-- Outer Precision Bezel Ring -->
    <circle cx="0" cy="0" r="148" fill="none" stroke="#475569" stroke-width="2" opacity="0.6" />
    <circle cx="0" cy="0" r="145" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.3" />

    <!-- 1. Yang / Upper S Ribbon: GOLD (XAUUSD - Nilai Abadi & Presisi) -->
    <path d="M 0 -144 
             A 144 144 0 0 1 128 68 
             C 95 38, 52 14, 0 14 
             C -40 14, -72 -16, -72 -58 
             C -72 -106, -38 -144, 0 -144 Z" 
          fill="url(#gold-flow)" />

    <!-- 2. Yin / Lower S Ribbon: BITCOIN & AI (Likuiditas & Algoritma Kuantum) -->
    <path d="M 0 144 
             A 144 144 0 0 1 -128 -68 
             C -95 -38, -52 -14, 0 -14 
             C 40 -14, 72 16, 72 58 
             C 72 106, 38 144, 0 144 Z" 
          fill="url(#cyan-btc-flow)" />

    <!-- 3. Central S-Spine Knife-Edge (Pemisah Transaksi & Eksekusi Cepat) -->
    <path d="M -18 -140 
             C -8 -70, -48 -10, 0 0 
             C 48 10, 8 70, 18 140" 
          fill="none" stroke="url(#spine-glow)" stroke-width="4.5" stroke-linecap="round" />

    <!-- 4. Upper Core: The Gold Sun Node (Fokus Emas XAUUSD di ( -26, -60 )) -->
    <g transform="translate(-26, -60)" filter="url(#core-bloom)">
      <circle cx="0" cy="0" r="18" fill="#090d16" />
      <circle cx="0" cy="0" r="14" fill="url(#cyan-btc-flow)" />
      <circle cx="0" cy="0" r="6" fill="#ffffff" />
      <path d="M 0 -9 L 0 -15 M 0 9 L 0 15 M -9 0 L -15 0 M 9 0 L 15 0" stroke="#00f5d4" stroke-width="1.4" opacity="0.8" />
    </g>

    <!-- 5. Lower Core: The Satoshi Node (Fokus Bitcoin di ( 26, 60 )) -->
    <g transform="translate(26, 60)" filter="url(#core-bloom)">
      <circle cx="0" cy="0" r="18" fill="#090d16" />
      <circle cx="0" cy="0" r="14" fill="url(#gold-flow)" />
      <circle cx="0" cy="0" r="6" fill="#ffffff" />
      <path d="M 0 -9 L 0 -15 M 0 9 L 0 15 M -9 0 L -15 0 M 9 0 L 15 0" stroke="#ffd700" stroke-width="1.4" opacity="0.8" />
    </g>
  </g>

  <!-- ==============================================
       TYPOGRAPHY SECTION (FinTech Tier-1 Standard)
       ============================================== -->
  <g text-anchor="middle">
    <!-- Acronym Monogram Pill (SSI) -->
    <rect x="264" y="396" width="72" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="300" y="411" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffd700" letter-spacing="3.5">SSI</text>

    <!-- Brand Name: SURGA -->
    <text x="300" y="468" 
          font-family="'Montserrat', 'Inter', system-ui, sans-serif" 
          font-size="52" 
          font-weight="800" 
          fill="#f8fafc" 
          letter-spacing="9"
          filter="url(#text-gold-glow)">
      SURGA
    </text>

    <!-- Subtitle: SUPER INTELLIGENCE -->
    <text x="300" y="504" 
          font-family="'Inter', system-ui, sans-serif" 
          font-size="16" 
          font-weight="700" 
          fill="#38bdf8" 
          letter-spacing="6">
      SUPER INTELLIGENCE
    </text>

    <!-- Discipline Pillar Tagline -->
    <text x="300" y="534" 
          font-family="'Inter', system-ui, sans-serif" 
          font-size="11" 
          font-weight="600" 
          fill="#64748b" 
          letter-spacing="4">
      QUANTITATIVE GOLD &amp; BITCOIN
    </text>
  </g>
</svg>
