<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian High-Tech Quant Background -->
    <radialGradient id="flow-dark-bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#0c1024" />
      <stop offset="55%" stop-color="#070a17" />
      <stop offset="100%" stop-color="#03050c" />
    </radialGradient>

    <!-- Wing 1: Blue flowing towards Violet/Purple at the core head -->
    <linearGradient id="flow-blue-to-purple" x1="0%" y1="0%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#00e1ff" />  <!-- Ekor: Cyan Elektrik Murni -->
      <stop offset="40%" stop-color="#0066ff" /> <!-- Tubuh: Royal Cobalt Blue -->
      <stop offset="75%" stop-color="#641ae6" /> <!-- Leher: Deep Violet -->
      <stop offset="100%" stop-color="#a81ee8" /><!-- Kepala: Magenta/Purple menyusup -->
    </linearGradient>

    <!-- Wing 2: Magenta/Purple flowing towards Cyan/Blue at the core head -->
    <linearGradient id="flow-purple-to-blue" x1="0%" y1="100%" x2="100%" y2="15%">
      <stop offset="0%" stop-color="#ea1fbe" />  <!-- Ekor: Vivid Neon Magenta Murni -->
      <stop offset="40%" stop-color="#8e1ee8" /> <!-- Tubuh: Electric Purple -->
      <stop offset="75%" stop-color="#1b3fe2" /> <!-- Leher: Royal Blue -->
      <stop offset="100%" stop-color="#00c8ff" /><!-- Kepala: Cyan menyusup -->
    </linearGradient>

    <!-- High-Contrast Clean Drop Shadow -->
    <filter id="flow-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="22" flood-color="#000000" flood-opacity="0.85" />
    </filter>

    <filter id="flow-text-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#000000" flood-opacity="0.9" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" fill="url(#flow-dark-bg)" rx="32" />

  <!-- Ambient Radar Compass Grid -->
  <g stroke="#1e2640" stroke-width="0.8" opacity="0.45" fill="none">
    <circle cx="300" cy="215" r="165" stroke-dasharray="3 5" />
    <circle cx="300" cy="215" r="148" />
    <line x1="120" y1="215" x2="480" y2="215" stroke-dasharray="2 6" />
    <line x1="300" y1="35" x2="300" y2="395" stroke-dasharray="2 6" />
  </g>

  <!-- EMBLEM GROUP: MUTUAL HARMONIC FLOW (S) -->
  <g transform="translate(300, 215) rotate(-22)" filter="url(#flow-shadow)">
    <!-- Precision Ring -->
    <circle cx="0" cy="0" r="148" fill="none" stroke="#253256" stroke-width="1.8" opacity="0.6" />
    <circle cx="0" cy="0" r="145" fill="none" stroke="#485c96" stroke-width="1" opacity="0.3" />

    <!-- 1. SAYAP BIRU (Ekor Cyan Murni -> Kepala Masuk ke Ungu) -->
    <path d="M 0 -144 
             A 144 144 0 0 1 126 70 
             C 92 40, 50 16, 0 16 
             C -38 16, -68 -15, -68 -55 
             C -68 -105, -35 -144, 0 -144 Z" 
          fill="url(#flow-blue-to-purple)" />

    <!-- 2. SAYAP UNGU (Ekor Magenta Murni -> Kepala Masuk ke Biru) -->
    <path d="M 0 144 
             A 144 144 0 0 1 -126 -70 
             C -92 -40, -50 -16, 0 -16 
             C 38 -16, 68 15, 68 55 
             C 68 105, 35 144, 0 144 Z" 
          fill="url(#flow-purple-to-blue)" />
  </g>

  <!-- TYPOGRAPHY SECTION -->
  <g text-anchor="middle">
    <!-- Monogram Pill: SSI -->
    <rect x="264" y="396" width="72" height="22" rx="11" fill="#0d142b" stroke="#3b4d82" stroke-width="1.2" />
    <text x="300" y="411" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="800" fill="#00e1ff" letter-spacing="3.5">SSI</text>

    <!-- Brand Name: SURGA -->
    <text x="300" y="468" 
          font-family="'Montserrat', 'Inter', system-ui, sans-serif" 
          font-size="52" 
          font-weight="800" 
          fill="#ffffff" 
          letter-spacing="9"
          filter="url(#flow-text-shadow)">
      SURGA
    </text>

    <!-- Subtitle: SUPER INTELLIGENCE -->
    <text x="300" y="504" 
          font-family="'Inter', system-ui, sans-serif" 
          font-size="16" 
          font-weight="700" 
          fill="#c084fc" 
          letter-spacing="6">
      SUPER INTELLIGENCE
    </text>

    <!-- Tagline: PERPETUAL COMPOUNDING -->
    <text x="300" y="534" 
          font-family="'Inter', system-ui, sans-serif" 
          font-size="11" 
          font-weight="700" 
          fill="#38bdf8" 
          letter-spacing="4">
      PERPETUAL COMPOUNDING
    </text>
  </g>
</svg>
