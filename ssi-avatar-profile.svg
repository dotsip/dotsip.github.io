<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Dark Eclipse Cosmos -->
    <radialGradient id="av-bg" cx="50%" cy="50%" r="68%">
      <stop offset="0%" stop-color="#150a24" />
      <stop offset="60%" stop-color="#0a0414" />
      <stop offset="100%" stop-color="#04010a" />
    </radialGradient>

    <!-- Wing 1: Solar Flare & 24K Sunburst Gold -->
    <linearGradient id="av-solar-wing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff176" />
      <stop offset="35%" stop-color="#ff8400" />
      <stop offset="75%" stop-color="#e63900" />
      <stop offset="100%" stop-color="#801500" />
    </linearGradient>

    <!-- Wing 2: Cosmic Ultraviolet & Deep Space Violet -->
    <linearGradient id="av-violet-wing" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f000ff" />
      <stop offset="45%" stop-color="#7c00ff" />
      <stop offset="85%" stop-color="#3b00c4" />
      <stop offset="100%" stop-color="#18006b" />
    </linearGradient>

    <!-- Deep 3D Drop Shadow -->
    <filter id="av-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.88" />
    </filter>

    <!-- Circular Clip Path -->
    <clipPath id="circle-clip">
      <circle cx="300" cy="300" r="296" />
    </clipPath>
  </defs>

  <!-- Circular Outer Border Ring -->
  <circle cx="300" cy="300" r="298" fill="#ff8400" opacity="0.3" />
  
  <!-- Circular Clipped Canvas -->
  <g clip-path="url(#circle-clip)">
    <!-- Background Canvas -->
    <circle cx="300" cy="300" r="296" fill="url(#av-bg)" />

    <!-- Radar Coordinate Rings -->
    <g stroke="#2b1447" stroke-width="1.2" opacity="0.55" fill="none">
      <circle cx="300" cy="300" r="215" stroke-dasharray="3 6" />
      <circle cx="300" cy="300" r="195" />
      <line x1="80" y1="300" x2="520" y2="300" stroke-dasharray="2 8" />
      <line x1="300" y1="80" x2="300" y2="520" stroke-dasharray="2 8" />
    </g>

    <!-- PURE EMBLEM (CENTERED, SCALED 1.15x) -->
    <g transform="translate(300, 300) scale(1.15) rotate(-22)" filter="url(#av-shadow)">
      <circle cx="0" cy="0" r="148" fill="none" stroke="#3d1e63" stroke-width="2" opacity="0.6" />
      <circle cx="0" cy="0" r="145" fill="none" stroke="#6e3ba8" stroke-width="1" opacity="0.3" />

      <!-- Upper Wing: Solar Flare -->
      <path d="M 0 -144 
               A 144 144 0 0 1 126 70 
               C 92 40, 50 16, 0 16 
               C -38 16, -68 -15, -68 -55 
               C -68 -105, -35 -144, 0 -144 Z" 
            fill="url(#av-solar-wing)" />

      <!-- Lower Wing: Cosmic Violet -->
      <path d="M 0 144 
               A 144 144 0 0 1 -126 -70 
               C -92 -40, -50 -16, 0 -16 
               C 38 -16, 68 15, 68 55 
               C 68 105, 35 144, 0 144 Z" 
            fill="url(#av-violet-wing)" />
    </g>
  </g>
</svg>
