<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Background with Radial Vignette -->
    <radialGradient id="v1-bg" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="50%" stop-color="#090d16" />
      <stop offset="100%" stop-color="#04060a" />
    </radialGradient>

    <!-- Imperial Liquid Gold (XAUUSD / Emas Murni) -->
    <linearGradient id="v1-gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff4c2" />
      <stop offset="25%" stop-color="#ffd700" />
      <stop offset="65%" stop-color="#d4af37" />
      <stop offset="100%" stop-color="#855f05" />
    </linearGradient>

    <!-- Satoshi Cyan & Sapphire (Bitcoin / Super Intelligence) -->
    <linearGradient id="v1-btc" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00f5d4" />
      <stop offset="35%" stop-color="#00bbf9" />
      <stop offset="75%" stop-color="#2563eb" />
      <stop offset="100%" stop-color="#1e1b4b" />
    </linearGradient>

    <!-- Ambient Gold Glow & Deep Shadows -->
    <filter id="v1-shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#ffd700" flood-opacity="0.25" />
      <feDropShadow dx="0" dy="24" stdDeviation="30" flood-color="#000000" flood-opacity="0.6" />
    </filter>

    <filter id="text-gold-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="4" flood-color="#ffd700" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="600" fill="url(#v1-bg)" rx="32" />

  <!-- Ambient Compass Grid -->
  <g stroke="#334155" stroke-width="0.8" opacity="0.25" fill="none">
    <circle cx="300" cy="215" r="165" stroke-dasharray="3 4" />
    <circle cx="300" cy="215" r="148" />
    <line x1="120" y1="215" x2="480" y2="215" stroke-dasharray="2 6" />
    <line x1="300" y1="35" x2="300" y2="395" stroke-dasharray="2 6" />
  </g>

  <!-- EMBLEM GROUP (S-Yin-Yang Murni Tanpa Garis Putih & Tanpa Titik) -->
  <g transform="translate(300, 215) rotate(-22)" filter="url(#v1-shadow)">
    <!-- Bezel Ring Presisi -->
    <circle cx="0" cy="0" r="148" fill="none" stroke="#475569" stroke-width="2" opacity="0.6" />
    <circle cx="0" cy="0" r="145" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.3" />

    <!-- 1. Yang / Upper S Half: 24K LIQUID GOLD (XAUUSD) -->
    <path d="M 0 -144 
             A 144 144 0 0 1 0 144 
             A 72 72 0 0 0 0 0 
             A 72 72 0 0 1 0 -144 
             Z" 
          fill="url(#v1-gold)" />

    <!-- 2. Yin / Lower S Half: SATOSHI CYAN & SAPPHIRE (BITCOIN / AI) -->
    <path d="M 0 144 
             A 144 144 0 0 1 0 -144 
             A 72 72 0 0 0 0 0 
             A 72 72 0 0 1 0 144 
             Z" 
          fill="url(#v1-btc)" />
  </g>

  <!-- TYPOGRAPHY SECTION -->
  <g text-anchor="middle">
    <!-- Acronym Pill: SSI -->
    <rect x="264" y="396" width="72" height="22" rx="11" fill="#1e293b" stroke="#334155" stroke-width="1" />
    <text x="300" y="411" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="800" fill="#ffd700" letter-spacing="3.5">SSI</text>

    <!-- Brand Name: SURGA -->
    <text x="300" y="468" 
          font-family="'Montserrat', 'Inter', system-ui, sans-serif" 
          font-size="52" 
          font-weight="800" 
          fill="#f8fafc" 
          letter-spacing="9"
          filter="url(#text-gold-glow)">
      SURGA
    </text>

    <!-- Subtitle: SUPER INTELLIGENCE -->
    <text x="300" y="504" 
          font-family="'Inter', system-ui, sans-serif" 
          font-size="16" 
          font-weight="700" 
          fill="#38bdf8" 
          letter-spacing="6">
      SUPER INTELLIGENCE
    </text>

    <!-- Tagline: PERPETUAL COMPOUNDING -->
    <text x="300" y="534" 
          font-family="'Inter', system-ui, sans-serif" 
          font-size="11" 
          font-weight="700" 
          fill="#10b981" 
          letter-spacing="4">
      PERPETUAL COMPOUNDING
    </text>
  </g>
</svg>
