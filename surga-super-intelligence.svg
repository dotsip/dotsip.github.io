<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Vignette -->
    <radialGradient id="bg-vignette" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#121e33" />
      <stop offset="45%" stop-color="#0a1220" />
      <stop offset="85%" stop-color="#05080f" />
      <stop offset="100%" stop-color="#03050a" />
    </radialGradient>

    <!-- Ambient Cyan Radial Glow Behind Sphere -->
    <radialGradient id="sphere-ambient-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.55" />
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.3" />
      <stop offset="70%" stop-color="#0369a1" stop-opacity="0.1" />
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0" />
    </radialGradient>

    <!-- Intense Central Star Flare Gradient -->
    <radialGradient id="core-flare-grad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="20%" stop-color="#e0f2fe" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#38bdf8" stop-opacity="0.5" />
      <stop offset="80%" stop-color="#0284c7" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Translucent Crystalline Facet Gradients -->
    <linearGradient id="facet-cyan-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.05" />
    </linearGradient>

    <linearGradient id="facet-soft-grad" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#67e8f9" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0369a1" stop-opacity="0.05" />
    </linearGradient>

    <!-- Glow Filters -->
    <filter id="bloom-soft" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="bloom-intense" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="14" result="blur1" />
      <feGaussianBlur stdDeviation="5" result="blur2" />
      <feMerge>
        <feMergeNode in="blur1" />
        <feMergeNode in="blur2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#38bdf8" flood-opacity="0.65" />
      <feDropShadow dx="0" dy="0" stdDeviation="16" flood-color="#0284c7" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- 1. Background -->
  <rect width="1200" height="675" fill="url(#bg-vignette)" />

  <!-- 2. Ambient Deep Light Glow Behind Central Orb -->
  <circle cx="600" cy="260" r="320" fill="url(#sphere-ambient-glow)" />

  <!-- 3. Circuit Board (PCB) Traces Left & Right -->
  <g stroke="#38bdf8" stroke-width="1.3" opacity="0.38" fill="none">
    <path d="M 330 165 L 485 165" />
    <path d="M 360 190 L 430 190 L 450 205 L 485 205" />
    <path d="M 310 215 L 415 215 L 435 230 L 475 230" />
    <path d="M 345 240 L 470 240" />
    <path d="M 320 260 L 468 260" />
    <path d="M 350 280 L 470 280" />
    <path d="M 315 305 L 420 305 L 440 290 L 475 290" />
    <path d="M 365 330 L 435 330 L 455 315 L 485 315" />
    <path d="M 330 355 L 485 355" />
    <path d="M 870 165 L 715 165" />
    <path d="M 840 190 L 770 190 L 750 205 L 715 205" />
    <path d="M 890 215 L 785 215 L 765 230 L 725 230" />
    <path d="M 855 240 L 730 240" />
    <path d="M 880 260 L 732 260" />
    <path d="M 850 280 L 730 280" />
    <path d="M 885 305 L 780 305 L 760 290 L 725 290" />
    <path d="M 835 330 L 765 330 L 745 315 L 715 315" />
    <path d="M 870 355 L 715 355" />
  </g>

  <!-- PCB Solder Dots / Pads -->
  <g fill="#7dd3fc" opacity="0.65">
    <circle cx="330" cy="165" r="2.2" />
    <circle cx="360" cy="190" r="2.2" />
    <circle cx="310" cy="215" r="2.2" />
    <circle cx="345" cy="240" r="2.2" />
    <circle cx="320" cy="260" r="2.2" />
    <circle cx="350" cy="280" r="2.2" />
    <circle cx="315" cy="305" r="2.2" />
    <circle cx="365" cy="330" r="2.2" />
    <circle cx="330" cy="355" r="2.2" />
    <circle cx="485" cy="165" r="2.2" />
    <circle cx="485" cy="205" r="2.2" />
    <circle cx="475" cy="230" r="2.2" />
    <circle cx="470" cy="240" r="2.2" />
    <circle cx="468" cy="260" r="2.2" />
    <circle cx="470" cy="280" r="2.2" />
    <circle cx="475" cy="290" r="2.2" />
    <circle cx="485" cy="315" r="2.2" />
    <circle cx="485" cy="355" r="2.2" />
    <circle cx="870" cy="165" r="2.2" />
    <circle cx="840" cy="190" r="2.2" />
    <circle cx="890" cy="215" r="2.2" />
    <circle cx="855" cy="240" r="2.2" />
    <circle cx="880" cy="260" r="2.2" />
    <circle cx="850" cy="280" r="2.2" />
    <circle cx="885" cy="305" r="2.2" />
    <circle cx="835" cy="330" r="2.2" />
    <circle cx="870" cy="355" r="2.2" />
    <circle cx="715" cy="165" r="2.2" />
    <circle cx="715" cy="205" r="2.2" />
    <circle cx="725" cy="230" r="2.2" />
    <circle cx="730" cy="240" r="2.2" />
    <circle cx="732" cy="260" r="2.2" />
    <circle cx="730" cy="280" r="2.2" />
    <circle cx="725" cy="290" r="2.2" />
    <circle cx="715" cy="315" r="2.2" />
    <circle cx="715" cy="355" r="2.2" />
  </g>

  <!-- 4. Luminous Crystal Sphere Assembly -->
  <!-- Outer Spherical Halo Ring -->
  <circle cx="600" cy="260" r="134" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.5" filter="url(#bloom-soft)" />
  <circle cx="600" cy="260" r="130" fill="none" stroke="#e0f2fe" stroke-width="2.2" opacity="0.85" filter="url(#bloom-soft)" />

  <!-- 3D Spherical Coordinate Latitude & Longitude Arcs (Glass Orb Dimension) -->
  <g fill="none" stroke="#7dd3fc" stroke-width="1.2" opacity="0.55">
    <ellipse cx="600" cy="260" rx="65" ry="130" />
    <ellipse cx="600" cy="260" rx="32" ry="130" stroke-dasharray="3 3" opacity="0.3" />
    <ellipse cx="600" cy="260" rx="130" ry="65" />
    <ellipse cx="600" cy="260" rx="130" ry="32" stroke-dasharray="3 3" opacity="0.3" />
    <ellipse cx="600" cy="260" rx="130" ry="72" transform="rotate(45 600 260)" opacity="0.45" />
    <ellipse cx="600" cy="260" rx="130" ry="72" transform="rotate(-45 600 260)" opacity="0.45" />
  </g>

  <!-- 5. Sacred Geometry - 8-Fold Crystalline Mandala Facets -->
  <g fill="url(#facet-cyan-grad)" stroke="#bae6fd" stroke-width="1.4" opacity="0.75" filter="url(#bloom-soft)">
    <path d="M 600.0 130.0 L 576.3 202.7 L 623.7 202.7 Z" />
    <path d="M 691.9 168.1 L 623.7 202.7 L 657.3 236.3 Z" />
    <path d="M 730.0 260.0 L 657.3 236.3 L 657.3 283.7 Z" />
    <path d="M 691.9 351.9 L 657.3 283.7 L 623.7 317.3 Z" />
    <path d="M 600.0 390.0 L 623.7 317.3 L 576.3 317.3 Z" />
    <path d="M 508.1 351.9 L 576.3 317.3 L 542.7 283.7 Z" />
    <path d="M 470.0 260.0 L 542.7 283.7 L 542.7 236.3 Z" />
    <path d="M 508.1 168.1 L 542.7 236.3 L 576.3 202.7 Z" />
  </g>

  <!-- Diamond Facets Radiating from Center -->
  <g fill="url(#facet-soft-grad)" stroke="#ffffff" stroke-width="1.6" opacity="0.85">
    <path d="M 600.0 174.0 L 623.7 202.7 L 600 260 L 576.3 202.7 Z" />
    <path d="M 660.8 199.2 L 657.3 236.3 L 600 260 L 623.7 202.7 Z" />
    <path d="M 686.0 260.0 L 657.3 283.7 L 600 260 L 657.3 236.3 Z" />
    <path d="M 660.8 320.8 L 623.7 317.3 L 600 260 L 657.3 283.7 Z" />
    <path d="M 600.0 346.0 L 576.3 317.3 L 600 260 L 623.7 317.3 Z" />
    <path d="M 539.2 320.8 L 542.7 283.7 L 600 260 L 576.3 317.3 Z" />
    <path d="M 514.0 260.0 L 542.7 236.3 L 600 260 L 542.7 283.7 Z" />
    <path d="M 539.2 199.2 L 576.3 202.7 L 600 260 L 542.7 236.3 Z" />
  </g>

  <!-- Hexagonal / Octagram Intersecting Geometry Grid -->
  <g fill="none" stroke="#e0f2fe" stroke-width="1.5" opacity="0.7">
    <polygon points="600.0,130.0 730.0,260.0 600.0,390.0 470.0,260.0" stroke-width="1.8" />
    <polygon points="691.9,168.1 691.9,351.9 508.1,351.9 508.1,168.1" stroke-width="1.8" />
    <polygon points="600.0,174.0 660.8,199.2 686.0,260.0 660.8,320.8 600.0,346.0 539.2,320.8 514.0,260.0 539.2,199.2" stroke="#67e8f9" stroke-width="1.2" opacity="0.9" />
    <polygon points="623.7,202.7 657.3,236.3 657.3,283.7 623.7,317.3 576.3,317.3 542.7,283.7 542.7,236.3 576.3,202.7" stroke="#ffffff" stroke-width="1.4" opacity="0.8" />
  </g>

  <!-- Outer Ring Facet Nodes (8 Outer Diamonds) -->
  <g fill="#ffffff" filter="url(#bloom-soft)">
    <circle cx="600.0" cy="130.0" r="2.8" />
    <circle cx="691.9" cy="168.1" r="2.8" />
    <circle cx="730.0" cy="260.0" r="2.8" />
    <circle cx="691.9" cy="351.9" r="2.8" />
    <circle cx="600.0" cy="390.0" r="2.8" />
    <circle cx="508.1" cy="351.9" r="2.8" />
    <circle cx="470.0" cy="260.0" r="2.8" />
    <circle cx="508.1" cy="168.1" r="2.8" />
  </g>

  <!-- 6. Radiant 8-Pointed Central Star (Pulsar Light Core) -->
  <circle cx="600" cy="260" r="95" fill="url(#core-flare-grad)" filter="url(#bloom-intense)" />

  <!-- Horizontal & Vertical Lens Flare Streaks -->
  <ellipse cx="600" cy="260" rx="160" ry="2.2" fill="#ffffff" opacity="0.9" filter="url(#bloom-soft)" />
  <ellipse cx="600" cy="260" rx="2.2" ry="160" fill="#ffffff" opacity="0.9" filter="url(#bloom-soft)" />
  <ellipse cx="600" cy="260" rx="100" ry="1.8" transform="rotate(45 600 260)" fill="#7dd3fc" opacity="0.75" />
  <ellipse cx="600" cy="260" rx="1.8" ry="100" transform="rotate(45 600 260)" fill="#7dd3fc" opacity="0.75" />

  <!-- Central 8-Pointed Star Diamonds -->
  <g filter="url(#bloom-intense)">
    <polygon points="600,186 608,248 674,260 608,272 600,334 592,272 526,260 592,248" fill="#ffffff" />
    <polygon points="600,208 606,252 652,260 606,268 600,312 594,268 548,260 594,252" fill="#e0f2fe" transform="rotate(45 600 260)" />
  </g>

  <!-- Blinding White Center Nucleus -->
  <circle cx="600" cy="260" r="14" fill="#ffffff" filter="url(#bloom-soft)" />
  <circle cx="600" cy="260" r="6" fill="#ffffff" />

  <!-- 7. Perimeter Lens Flares & Colored Sparkles -->
  <!-- Top-Left Cyan Lens Flare -->
  <g transform="translate(505, 170)" filter="url(#bloom-soft)">
    <circle cx="0" cy="0" r="16" fill="#38bdf8" opacity="0.6" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
    <path d="M 0 -18 L 0 18 M -18 0 L 18 0" stroke="#ffffff" stroke-width="1.2" opacity="0.8" />
  </g>

  <!-- Top-Right Violet/Purple Sparkle Flare -->
  <g transform="translate(705, 175)" filter="url(#bloom-soft)">
    <circle cx="0" cy="0" r="18" fill="#c084fc" opacity="0.55" />
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
    <path d="M 0 -16 L 0 16 M -16 0 L 16 0" stroke="#f3e8ff" stroke-width="1.2" opacity="0.85" />
  </g>

  <!-- Bottom-Left Violet Sparkle Flare -->
  <g transform="translate(495, 345)" filter="url(#bloom-soft)">
    <circle cx="0" cy="0" r="15" fill="#a855f7" opacity="0.5" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>

  <!-- Bottom-Right Cyan Flare -->
  <g transform="translate(695, 345)" filter="url(#bloom-soft)">
    <circle cx="0" cy="0" r="15" fill="#38bdf8" opacity="0.5" />
    <circle cx="0" cy="0" r="3" fill="#ffffff" />
  </g>

  <!-- 8. Typography Section -->
  <g text-anchor="middle">
    <!-- Brand Name: SURGA -->
    <text x="600" y="495" 
          font-family="'Montserrat', 'Rajdhani', 'Segoe UI', system-ui, sans-serif" 
          font-size="68" 
          font-weight="800" 
          fill="#cffafe" 
          letter-spacing="12"
          filter="url(#text-glow)">
      SURGA
    </text>

    <!-- Subtitle: SUPER INTELLIGENCE -->
    <text x="600" y="542" 
          font-family="'Montserrat', 'Segoe UI', system-ui, sans-serif" 
          font-size="21" 
          font-weight="700" 
          fill="#7dd3fc" 
          letter-spacing="7"
          opacity="0.92">
      SUPER INTELLIGENCE
    </text>
  </g>
</svg>
