<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" width="100%" height="100%">
  <defs>
    <!-- Background Matte Navy/Slate Vignette -->
    <radialGradient id="bg-vignette" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#141f30" />
      <stop offset="50%" stop-color="#0b1320" />
      <stop offset="85%" stop-color="#050912" />
      <stop offset="100%" stop-color="#03050a" />
    </radialGradient>

    <!-- Deep Ambient Blue Glow Behind Sphere -->
    <radialGradient id="sphere-ambient-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00d5ff" stop-opacity="0.65" />
      <stop offset="35%" stop-color="#0284c7" stop-opacity="0.38" />
      <stop offset="70%" stop-color="#0369a1" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#0c4a6e" stop-opacity="0" />
    </radialGradient>

    <!-- Holographic Luminous Sphere Body (Translucent Volumetric Orb) -->
    <radialGradient id="sphere-hologram" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#7dd3fc" stop-opacity="0.45" />
      <stop offset="40%" stop-color="#0284c7" stop-opacity="0.35" />
      <stop offset="75%" stop-color="#083344" stop-opacity="0.6" />
      <stop offset="95%" stop-color="#041a24" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.4" />
    </radialGradient>

    <!-- Top Spherical Glass Glare -->
    <linearGradient id="top-glare" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.6" />
      <stop offset="35%" stop-color="#7dd3fc" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </linearGradient>

    <!-- Pulsar Core Flare Gradient -->
    <radialGradient id="pulsar-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="15%" stop-color="#e0f2fe" stop-opacity="0.95" />
      <stop offset="45%" stop-color="#38bdf8" stop-opacity="0.75" />
      <stop offset="75%" stop-color="#0284c7" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0" />
    </radialGradient>

    <!-- Glow Filters -->
    <filter id="bloom-soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="bloom-high" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12" result="b1" />
      <feGaussianBlur stdDeviation="4" result="b2" />
      <feMerge>
        <feMergeNode in="b1" />
        <feMergeNode in="b2" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="sphere-rim-bloom" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="0" stdDeviation="10" flood-color="#38bdf8" flood-opacity="0.85" />
      <feDropShadow dx="0" dy="0" stdDeviation="22" flood-color="#0284c7" flood-opacity="0.5" />
    </filter>

    <filter id="text-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="7" flood-color="#38bdf8" flood-opacity="0.75" />
      <feDropShadow dx="0" dy="0" stdDeviation="18" flood-color="#0284c7" flood-opacity="0.45" />
    </filter>
  </defs>

  <!-- 1. Background -->
  <rect width="1200" height="675" fill="url(#bg-vignette)" />

  <!-- 2. Ambient Deep Blue Backlight -->
  <circle cx="600" cy="260" r="320" fill="url(#sphere-ambient-glow)" />

  <!-- 3. Circuit Board (PCB) Traces Left & Right -->
  <g stroke="#38bdf8" stroke-width="1.3" opacity="0.38" fill="none">
    <path d="M 320 160 L 485 160" />
    <path d="M 350 185 L 435 185 L 455 200 L 490 200" />
    <path d="M 310 210 L 415 210 L 435 225 L 480 225" />
    <path d="M 340 235 L 472 235" />
    <path d="M 315 255 L 468 255" />
    <path d="M 345 275 L 472 275" />
    <path d="M 310 300 L 415 300 L 435 285 L 480 285" />
    <path d="M 350 325 L 435 325 L 455 310 L 490 310" />
    <path d="M 320 350 L 485 350" />
    <path d="M 880 160 L 715 160" />
    <path d="M 850 185 L 765 185 L 745 200 L 710 200" />
    <path d="M 890 210 L 785 210 L 765 225 L 720 225" />
    <path d="M 860 235 L 728 235" />
    <path d="M 885 255 L 732 255" />
    <path d="M 855 275 L 728 275" />
    <path d="M 890 300 L 785 300 L 765 285 L 720 285" />
    <path d="M 850 325 L 765 325 L 745 310 L 710 310" />
    <path d="M 880 350 L 715 350" />
  </g>

  <!-- PCB Solder Pads -->
  <g fill="#7dd3fc" opacity="0.65">
    <circle cx="320" cy="160" r="2.2" />
    <circle cx="350" cy="185" r="2.2" />
    <circle cx="310" cy="210" r="2.2" />
    <circle cx="340" cy="235" r="2.2" />
    <circle cx="315" cy="255" r="2.2" />
    <circle cx="345" cy="275" r="2.2" />
    <circle cx="310" cy="300" r="2.2" />
    <circle cx="350" cy="325" r="2.2" />
    <circle cx="320" cy="350" r="2.2" />
    <circle cx="485" cy="160" r="2.2" />
    <circle cx="490" cy="200" r="2.2" />
    <circle cx="480" cy="225" r="2.2" />
    <circle cx="472" cy="235" r="2.2" />
    <circle cx="468" cy="255" r="2.2" />
    <circle cx="472" cy="275" r="2.2" />
    <circle cx="480" cy="285" r="2.2" />
    <circle cx="490" cy="310" r="2.2" />
    <circle cx="485" cy="350" r="2.2" />
    <circle cx="880" cy="160" r="2.2" />
    <circle cx="850" cy="185" r="2.2" />
    <circle cx="890" cy="210" r="2.2" />
    <circle cx="860" cy="235" r="2.2" />
    <circle cx="885" cy="255" r="2.2" />
    <circle cx="855" cy="275" r="2.2" />
    <circle cx="890" cy="300" r="2.2" />
    <circle cx="850" cy="325" r="2.2" />
    <circle cx="880" cy="350" r="2.2" />
    <circle cx="715" cy="160" r="2.2" />
    <circle cx="710" cy="200" r="2.2" />
    <circle cx="720" cy="225" r="2.2" />
    <circle cx="728" cy="235" r="2.2" />
    <circle cx="732" cy="255" r="2.2" />
    <circle cx="728" cy="275" r="2.2" />
    <circle cx="720" cy="285" r="2.2" />
    <circle cx="710" cy="310" r="2.2" />
    <circle cx="715" cy="350" r="2.2" />
  </g>

  <!-- ========================================================
       4. THE LUMINOUS 3D HOLOGRAPHIC CRYSTAL SPHERE
       ======================================================== -->
  <!-- Solid Shaded Translucent Sphere Body -->
  <circle cx="600" cy="260" r="135" fill="url(#sphere-hologram)" />

  <!-- Top Spherical Glass Glare Crescent -->
  <path d="M 480 220 A 135 135 0 0 1 720 220 C 680 160 520 160 480 220 Z" fill="url(#top-glare)" opacity="0.6" filter="url(#bloom-soft)" />

  <!-- Outer Luminous Spherical Rim Ring -->
  <circle cx="600" cy="260" r="135" fill="none" stroke="#7dd3fc" stroke-width="4.5" opacity="0.8" filter="url(#sphere-rim-bloom)" />
  <circle cx="600" cy="260" r="135" fill="none" stroke="#ffffff" stroke-width="2.2" opacity="0.95" />

  <!-- 5. SPHERICAL CURVED GEODESIC LATTICE (Interlocking Sacred Arcs) -->
  <g fill="none" stroke="#bae6fd" stroke-width="1.6" opacity="0.8" filter="url(#bloom-soft)">
    <path d="M 465.0 260.0 A 135 88 0 0 0 735.0 260.0" />
    <path d="M 465.0 260.0 A 135 88 0 0 1 735.0 260.0" />
    <path d="M 600.0 125.0 A 88 135 0 0 0 600.0 395.0" />
    <path d="M 600.0 125.0 A 88 135 0 0 1 600.0 395.0" />
    <path d="M 504.5 164.5 A 135 88 45 0 0 695.5 355.5" />
    <path d="M 504.5 164.5 A 135 88 45 0 1 695.5 355.5" />
    <path d="M 695.5 164.5 A 135 88 -45 0 0 504.5 355.5" />
    <path d="M 695.5 164.5 A 135 88 -45 0 1 504.5 355.5" />
  </g>

  <!-- Subtle Inner Elliptical Latitude/Longitude Depth Arcs -->
  <g fill="none" stroke="#67e8f9" stroke-width="1.2" opacity="0.45" stroke-dasharray="6 3">
    <path d="M 465.0 260.0 A 135 50 0 0 0 735.0 260.0" />
    <path d="M 465.0 260.0 A 135 50 0 0 1 735.0 260.0" />
    <path d="M 600.0 125.0 A 50 135 0 0 0 600.0 395.0" />
    <path d="M 600.0 125.0 A 50 135 0 0 1 600.0 395.0" />
  </g>

  <!-- Radial Structure Spokes (Center to 8 Outer Vertices) -->
  <g stroke="#ffffff" stroke-width="1.3" opacity="0.75" filter="url(#bloom-soft)">
    <path d="M 600 260 L 600.0 125.0" />
    <path d="M 600 260 L 695.5 164.5" />
    <path d="M 600 260 L 735.0 260.0" />
    <path d="M 600 260 L 695.5 355.5" />
    <path d="M 600 260 L 600.0 395.0" />
    <path d="M 600 260 L 504.5 355.5" />
    <path d="M 600 260 L 465.0 260.0" />
    <path d="M 600 260 L 504.5 164.5" />
  </g>

  <!-- 6. OUTER TRIANGULAR FACET HOODS (8 Sacred Chevron Crowns) -->
  <g fill="#0284c7" fill-opacity="0.2" stroke="#ffffff" stroke-width="2.0" filter="url(#bloom-soft)">
    <path d="M 600.0 125.0 L 577.6 166.8 L 622.4 166.8 Z" />
    <path d="M 695.5 164.5 L 649.3 174.4 L 681.0 206.1 Z" />
    <path d="M 735.0 260.0 L 693.2 237.6 L 693.2 282.4 Z" />
    <path d="M 695.5 355.5 L 681.0 313.9 L 649.3 345.6 Z" />
    <path d="M 600.0 395.0 L 622.4 353.2 L 577.6 353.2 Z" />
    <path d="M 504.5 355.5 L 550.7 345.6 L 519.0 313.9 Z" />
    <path d="M 465.0 260.0 L 506.8 282.4 L 506.8 237.6 Z" />
    <path d="M 504.5 164.5 L 519.0 206.1 L 550.7 174.4 Z" />
  </g>

  <!-- Nested Inner Chevron Triangles -->
  <g fill="none" stroke="#e0f2fe" stroke-width="1.4" opacity="0.85">
    <path d="M 600.0 137.0 L 582.6 157.9 L 617.4 157.9 Z" />
    <path d="M 687.0 173.0 L 657.4 182.8 L 677.2 202.6 Z" />
    <path d="M 723.0 260.0 L 702.1 242.6 L 702.1 277.4 Z" />
    <path d="M 687.0 347.0 L 677.2 317.4 L 657.4 337.2 Z" />
    <path d="M 600.0 383.0 L 617.4 362.1 L 582.6 362.1 Z" />
    <path d="M 513.0 347.0 L 542.6 337.2 L 522.8 317.4 Z" />
    <path d="M 477.0 260.0 L 497.9 277.4 L 497.9 242.6 Z" />
    <path d="M 513.0 173.0 L 522.8 202.6 L 542.6 182.8 Z" />
  </g>

  <!-- Concentric Connecting Octagon Rings -->
  <g fill="none">
    <polygon points="600.0,164.0 667.9,192.1 696.0,260.0 667.9,327.9 600.0,356.0 532.1,327.9 504.0,260.0 532.1,192.1" stroke="#67e8f9" stroke-width="1.8" opacity="0.8" filter="url(#bloom-soft)" />
    <polygon points="627.6,193.5 666.5,232.4 666.5,287.6 627.6,326.5 572.4,326.5 533.5,287.6 533.5,232.4 572.4,193.5" stroke="#ffffff" stroke-width="1.6" opacity="0.85" filter="url(#bloom-soft)" />
    <polygon points="600.0,216.0 631.1,228.9 644.0,260.0 631.1,291.1 600.0,304.0 568.9,291.1 556.0,260.0 568.9,228.9" stroke="#7dd3fc" stroke-width="1.4" opacity="0.9" />
  </g>

  <!-- 8 Perimeter Node Sparkles -->
  <g fill="#ffffff" filter="url(#bloom-soft)">
    <circle cx="600.0" cy="125.0" r="3.2" />
    <circle cx="695.5" cy="164.5" r="3.2" />
    <circle cx="735.0" cy="260.0" r="3.2" />
    <circle cx="695.5" cy="355.5" r="3.2" />
    <circle cx="600.0" cy="395.0" r="3.2" />
    <circle cx="504.5" cy="355.5" r="3.2" />
    <circle cx="465.0" cy="260.0" r="3.2" />
    <circle cx="504.5" cy="164.5" r="3.2" />
  </g>

  <!-- ========================================================
       7. RADIANT 8-POINTED CENTRAL STAR (Pulsar Light Core)
       ======================================================== -->
  <!-- Ambient Intense Core Bloom Glow -->
  <circle cx="600" cy="260" r="95" fill="url(#pulsar-glow)" filter="url(#bloom-high)" />

  <!-- Horizontal & Vertical Brilliant Light Beams -->
  <ellipse cx="600" cy="260" rx="175" ry="2.6" fill="#ffffff" opacity="0.95" filter="url(#bloom-soft)" />
  <ellipse cx="600" cy="260" rx="2.6" ry="175" fill="#ffffff" opacity="0.95" filter="url(#bloom-soft)" />
  <ellipse cx="600" cy="260" rx="115" ry="2.0" transform="rotate(45 600 260)" fill="#7dd3fc" opacity="0.85" />
  <ellipse cx="600" cy="260" rx="2.0" ry="115" transform="rotate(45 600 260)" fill="#7dd3fc" opacity="0.85" />

  <!-- Central 8-Pointed Star Diamonds -->
  <g filter="url(#bloom-high)">
    <!-- Cardinal Sharp Star Rays (Vertical & Horizontal - 75px) -->
    <polygon points="600,185 609,248 675,260 609,272 600,335 591,272 525,260 591,248" fill="#ffffff" />

    <!-- Diagonal Sharp Star Rays (45-deg - 54px) -->
    <polygon points="600,206 607,251 654,260 607,269 600,314 593,269 546,260 593,251" fill="#e0f2fe" transform="rotate(45 600 260)" />
  </g>

  <!-- White-Hot Center Spark Nucleus -->
  <circle cx="600" cy="260" r="16" fill="#ffffff" filter="url(#bloom-soft)" />
  <circle cx="600" cy="260" r="8" fill="#ffffff" />

  <!-- ========================================================
       8. PERIMETER LENS FLARES & COLORED SPARKLES
       ======================================================== -->
  <!-- Top-Left Cyan Lens Flare (at ~10:30) -->
  <g transform="translate(505, 168)" filter="url(#bloom-soft)">
    <circle cx="0" cy="0" r="18" fill="#38bdf8" opacity="0.65" />
    <circle cx="0" cy="0" r="4.5" fill="#ffffff" />
    <path d="M 0 -22 L 0 22 M -22 0 L 22 0" stroke="#ffffff" stroke-width="1.4" opacity="0.85" />
  </g>

  <!-- Top-Right Violet/Purple Sparkle Flare (at ~1:30) -->
  <g transform="translate(705, 172)" filter="url(#bloom-soft)">
    <circle cx="0" cy="0" r="20" fill="#c084fc" opacity="0.6" />
    <circle cx="0" cy="0" r="4" fill="#ffffff" />
    <path d="M 0 -18 L 0 18 M -18 0 L 18 0" stroke="#f3e8ff" stroke-width="1.3" opacity="0.9" />
  </g>

  <!-- Bottom-Left Violet Sparkle Flare (at ~7:30) -->
  <g transform="translate(492, 345)" filter="url(#bloom-soft)">
    <circle cx="0" cy="0" r="16" fill="#a855f7" opacity="0.55" />
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
  </g>

  <!-- Bottom-Right Cyan Flare (at ~4:30) -->
  <g transform="translate(695, 345)" filter="url(#bloom-soft)">
    <circle cx="0" cy="0" r="16" fill="#38bdf8" opacity="0.55" />
    <circle cx="0" cy="0" r="3.5" fill="#ffffff" />
  </g>

  <!-- Top Rim Specular Halo Flare -->
  <ellipse cx="600" cy="127" rx="32" ry="5" fill="#ffffff" opacity="0.8" filter="url(#bloom-soft)" />

  <!-- ========================================================
       9. TIPOGRAFI PRESISI (Glowing Brand Typography)
       ======================================================== -->
  <g text-anchor="middle">
    <!-- Brand Name: SURGA -->
    <text x="600" y="495" 
          font-family="'Montserrat', 'Inter', 'Segoe UI', system-ui, sans-serif" 
          font-size="68" 
          font-weight="800" 
          fill="#cffafe" 
          letter-spacing="12"
          filter="url(#text-glow)">
      SURGA
    </text>

    <!-- Subtitle: SUPER INTELLIGENCE -->
    <text x="600" y="542" 
          font-family="'Montserrat', 'Inter', 'Segoe UI', system-ui, sans-serif" 
          font-size="21" 
          font-weight="700" 
          fill="#7dd3fc" 
          letter-spacing="7"
          opacity="0.92">
      SUPER INTELLIGENCE
    </text>
  </g>
</svg>
