<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" width="100%" height="100%">
  <defs>
    <!-- Deep Obsidian Clean Background -->
    <radialGradient id="pf1-bg" cx="50%" cy="42%" r="65%">
      <stop offset="0%" stop-color="#0d1424" />
      <stop offset="55%" stop-color="#080c16" />
      <stop offset="100%" stop-color="#04060a" />
    </radialGradient>

    <!-- Sayap Atas: Ekor Murni Hijau (100%, 85%) ➔ Kepala Menuju Merah (0%, 15%) -->
    <linearGradient id="green-to-red" x1="100%" y1="85%" x2="0%" y2="15%">
      <stop offset="0%" stop-color="#00f59b" />
      <stop offset="25%" stop-color="#10b981" />
      <stop offset="55%" stop-color="#059669" />
      <stop offset="72%" stop-color="#d97706" />
      <stop offset="88%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#f43f5e" />
    </linearGradient>

    <!-- Sayap Bawah: Ekor Murni Merah (0%, 15%) ➔ Kepala Menuju Hijau (100%, 85%) -->
    <linearGradient id="red-to-green" x1="0%" y1="15%" x2="100%" y2="85%">
      <stop offset="0%" stop-color="#ff2a55" />
      <stop offset="25%" stop-color="#ef4444" />
      <stop offset="55%" stop-color="#b91c1c" />
      <stop offset="72%" stop-color="#d97706" />
      <stop offset="88%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#00f59b" />
    </linearGradient>

    <!-- Pure Black Clean Shadow -->
    <filter id="pf1-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.8" />
    </filter>
  </defs>

  <rect width="600" height="600" fill="url(#pf1-bg)" rx="32" />

  <!-- Ambient Compass Grid -->
  <g stroke="#1e293b" stroke-width="0.8" opacity="0.4" fill="none">
    <circle cx="300" cy="215" r="165" stroke-dasharray="3 4" />
    <circle cx="300" cy="215" r="148" />
    <line x1="120" y1="215" x2="480" y2="215" stroke-dasharray="2 6" />
    <line x1="300" y1="35" x2="300" y2="395" stroke-dasharray="2 6" />
  </g>

  <!-- EMBLEM GROUP (Aerodynamic Slit S) -->
  <g transform="translate(300, 215) rotate(-22)" filter="url(#pf1-shadow)">
    <!-- Ring Presisi Luar -->
    <circle cx="0" cy="0" r="148" fill="none" stroke="#334155" stroke-width="1.8" opacity="0.6" />
    <circle cx="0" cy="0" r="145" fill="none" stroke="#94a3b8" stroke-width="1" opacity="0.3" />

    <!-- Sayap Atas: Ekor Murni Hijau ➔ Kepala Menuju Merah -->
    <path d="M 0 -144 
             A 144 144 0 0 1 126 70 
             C 92 40, 50 16, 0 16 
             C -38 16, -68 -15, -68 -55 
             C -68 -105, -35 -144, 0 -144 Z" 
          fill="url(#green-to-red)" />

    <!-- Sayap Bawah: Ekor Murni Merah ➔ Kepala Menuju Hijau -->
    <path d="M 0 144 
             A 144 144 0 0 1 -126 -70 
             C -92 -40, -50 -16, 0 -16 
             C 38 -16, 68 15, 68 55 
             C 68 105, 35 144, 0 144 Z" 
          fill="url(#red-to-green)" />
  </g>

  <!-- TYPOGRAPHY SECTION -->
  <g text-anchor="middle">
    <!-- Monogram Pill: SSI -->
    <rect x="264" y="396" width="72" height="22" rx="11" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="300" y="411" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="800" fill="#10b981" letter-spacing="3.5">SSI</text>

    <!-- Brand Name: SURGA -->
    <text x="300" y="468" font-family="'Montserrat', 'Inter', system-ui, sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="9">SURGA</text>

    <!-- Subtitle: SUPER INTELLIGENCE -->
    <text x="300" y="504" font-family="'Inter', system-ui, sans-serif" font-size="16" font-weight="700" fill="#a7f3d0" letter-spacing="6">SUPER INTELLIGENCE</text>

    <!-- Tagline: PERPETUAL COMPOUNDING -->
    <text x="300" y="534" font-family="'Inter', system-ui, sans-serif" font-size="11" font-weight="700" fill="#10b981" letter-spacing="4">PERPETUAL COMPOUNDING</text>
  </g>
</svg>
